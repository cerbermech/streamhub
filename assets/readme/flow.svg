  <path d="M300 182h77M672 182h77M1022 182h95" stroke="#42bdd0" stroke-width="4"/>
  <path d="m365 173 12 9-12 9m372-18 12 9-12 9m354-18 12 9-12 9" fill="none" stroke="#42bdd0" stroke-width="4"/>
