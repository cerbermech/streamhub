<!doctype html>
<html lang="ru">
  <meta charset="utf-8" /><meta
    name="viewport"
    content="width=device-width,initial-scale=1"
  /><title>STREAMHUB</title
  ><style>
    * {
      box-sizing: border-box;
    }
    body {
      margin: 0;
      background: #101519;
      color: #e5edf3;
      font:
        14px system-ui,
        sans-serif;
    }
    button,
    input,
    select {
      font: inherit;
    }
    button {
      cursor: pointer;
      background: #202930;
      border: 1px solid #35424c;
      color: #d8e4eb;
      border-radius: 6px;
      padding: 10px 14px;
    }
    button:hover {
      background: #2c3943;
    }
    button.active,
    .primary {
      color: #55ddea;
      border-color: #42c5d5;
      background: #17363e;
    }
    button:focus-visible,
    input:focus-visible,
    select:focus-visible {
      outline: 2px solid #52ddec;
      outline-offset: 2px;
    }
    header {
      height: 68px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 24px;
      border-bottom: 1px solid #2b353e;
      background: #171e24;
    }
    h1 {
      font-size: 24px;
      margin: 0;
      letter-spacing: -0.6px;
    }
    .logo {
      color: #56dbea;
      margin-right: 13px;
    }
    .badge {
      font-size: 12px;
      padding: 5px 9px;
      background: #32301d;
      color: #e8cb82;
      border-radius: 4px;
    }
    .app {
      display: flex;
      height: calc(100vh - 103px);
    }
    aside {
      width: 242px;
      flex-shrink: 0;
      background: #171f26;
      border-right: 1px solid #2b353e;
      overflow: auto;
    }
    nav {
      padding: 14px 10px;
      border-bottom: 1px solid #2b353e;
    }
    nav button {
      display: block;
      width: 100%;
      text-align: left;
      margin: 3px 0;
      border: 0;
      background: none;
      padding: 14px;
    }
    nav button.active {
      border-left: 3px solid #50dce9;
      border-radius: 3px;
      background: #21333d;
    }
    .sources {
      padding: 18px 14px;
    }
    input,
    select {
      background: #121a20;
      border: 1px solid #394852;
      border-radius: 5px;
      color: #e5edf3;
      padding: 10px;
      width: 100%;
    }
    input {
      margin: 8px 0;
    }
    h3 {
      font-size: 14px;
      margin: 0 0 12px;
    }
    h4 {
      color: #8a9ca9;
      font-size: 12px;
      text-transform: uppercase;
      letter-spacing: 1px;
      margin: 23px 0 9px;
    }
    .source {
      display: flex;
      gap: 9px;
      align-items: center;
      width: 100%;
      padding: 9px 4px;
      border: 0;
      background: none;
      text-align: left;
      font-size: 13px;
    }
    .dot {
      width: 6px;
      height: 6px;
      border-radius: 50%;
      background: #74a0ad;
      flex-shrink: 0;
    }
    .workspace {
      flex: 1;
      min-width: 0;
      display: flex;
      flex-direction: column;
    }
    .toolbar {
      min-height: 70px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      padding: 12px 18px;
      flex-wrap: wrap;
    }
    .tools {
      display: flex;
      gap: 8px;
      align-items: center;
    }
    .grid {
      display: grid;
      flex: 1;
      min-height: 0;
      gap: 7px;
      padding: 0 12px 12px;
      grid-template-columns: repeat(var(--cols), minmax(0, 1fr));
      grid-template-rows: repeat(var(--rows), minmax(0, 1fr));
    }
    .tile {
      position: relative;
      overflow: hidden;
      border: 1px solid #3b4953;
      background: #11191e;
      min-height: 100px;
      border-radius: 3px;
    }
    .tile.selected {
      border: 2px solid #53d6e4;
    }
    .frame {
      position: absolute;
      inset: 0;
      background-image: var(--demo);
      background-size: 358% 367%;
      background-position: var(--x) var(--y);
      filter: saturate(0.65);
    }
    .tile:after {
      content: "";
      position: absolute;
      inset: 0;
      background: linear-gradient(
        #0008,
        transparent 30%,
        transparent 70%,
        #0009
      );
      pointer-events: none;
    }
    .tile-head,
    .tile-foot {
      position: absolute;
      z-index: 1;
      left: 12px;
      right: 12px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
    }
    .tile-head {
      top: 10px;
      font-size: 13px;
      text-shadow: 0 1px 3px #000;
    }
    .tile-foot {
      bottom: 9px;
      color: #d2dce2;
      font-size: 12px;
    }
    .tile select {
      width: 145px;
      padding: 4px;
      background: #10191dcc;
      font-size: 12px;
    }
    .demo-tag {
      color: #ffe0a0;
      background: #191d20b0;
      padding: 3px 5px;
      font-size: 10px;
      letter-spacing: 1px;
    }
    .empty {
      height: 100%;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-direction: column;
      color: #718593;
      gap: 12px;
    }
    .empty b {
      font-size: 32px;
      font-weight: 400;
    }
    .footer {
      height: 35px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 18px;
      background: #192128;
      color: #92a6b4;
      font-size: 12px;
      border-top: 1px solid #2d3b45;
    }
    .content {
      padding: 8px 24px 24px;
      overflow: auto;
    }
    .content h2 {
      font-size: 24px;
    }
    .muted {
      color: #8ea1af;
    }
    .cards {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(250px, 1fr));
      gap: 14px;
    }
    .card {
      background: #19232b;
      border: 1px solid #30414d;
      border-radius: 8px;
      padding: 20px;
    }
    .card p {
      color: #9fb0bc;
      line-height: 1.6;
    }
    .card button {
      margin-right: 6px;
    }
    .row {
      padding: 14px;
      border-bottom: 1px solid #2b3944;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
    }
    dialog {
      background: #1b252e;
      color: #e2ebf0;
      border: 1px solid #4b6271;
      border-radius: 12px;
      width: min(460px, 90vw);
      padding: 26px;
    }
    dialog::backdrop {
      background: #000a;
    }
    dialog h2 {
      margin-top: 0;
    }
    dialog label {
      display: block;
      margin-top: 14px;
    }
    dialog .tools {
      justify-content: flex-end;
      margin-top: 22px;
    }
    #toast {
      position: fixed;
      bottom: 52px;
      left: 50%;
      transform: translateX(-50%);
      background: #29434d;
      padding: 13px 24px;
      border: 1px solid #4f7986;
      border-radius: 8px;
      z-index: 9;
      display: none;
    }
    video {
      width: 100%;
      height: 100%;
      object-fit: contain;
    }
    .help {
      font-size: 13px;
      line-height: 1.7;
      color: #9aafbd;
    }
    .layout-icon {
      display: grid;
      gap: 2px;
      width: 20px;
      height: 18px;
      grid-template-columns: repeat(var(--n), 1fr);
    }
    .layout-icon i {
      border: 1px solid currentColor;
    }
    .layout-button {
      padding: 10px;
    }
    #saved {
      max-width: 175px;
      font-size: 13px;
    }
    .hide-side aside {
      display: none;
    }
    @media (max-width: 900px) {
      aside {
        width: 190px;
      }
      .toolbar {
        padding: 10px;
      }
      .tools {
        gap: 5px;
      }
      button {
        padding: 9px;
      }
      .tile-head {
        left: 6px;
        font-size: 12px;
      }
      .tile-foot {
        left: 6px;
      }
      .tile select {
        width: 100px;
      }
    }
    @media (max-width: 620px) {
      aside {
        width: 64px;
      }
      .sources {
        display: none;
      }
      nav button {
        font-size: 0;
      }
      nav button span {
        font-size: 22px;
      }
      header {
        padding: 0 12px;
      }
      h1 {
        font-size: 19px;
      }
      .badge {
        font-size: 10px;
      }
      .grid {
        overflow: auto;
        grid-template-columns: repeat(min(var(--cols), 2), 1fr);
        grid-auto-rows: 180px;
        grid-template-rows: none;
      }
      .footer span:last-child {
        display: none;
      }
      .tile-head {
        flex-wrap: wrap;
      }
      .tools {
        flex-wrap: wrap;
      }
      .toolbar {
        min-height: 110px;
      }
    }
    .links-dialog {
      width: min(660px, 94vw);
      max-height: 90vh;
      overflow: auto;
    }
    .copy-row {
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .copy-row input {
      min-width: 0;
      flex: 1;
    }
    .copy-row button {
      flex-shrink: 0;
    }
    .link-heading {
      margin: 22px 0 8px;
      color: #55ddea;
    }
    .fit-button {
      padding: 4px 7px;
      font-size: 11px;
      background: #10191dcc;
    }
    .tile-foot {
      flex-wrap: wrap;
    }
    dialog {
      max-height: 90vh;
      overflow: auto;
    }
    button:disabled {
      opacity: 0.45;
      cursor: default;
    }
    .tile.drag-over {
      outline: 3px solid #53d6e4;
      outline-offset: -4px;
    }
    .source[draggable="true"] {
      cursor: grab;
    }
    .tile[draggable="true"] {
      cursor: grab;
    }
    .focus-mode aside,
    .focus-mode header,
    .focus-mode .footer,
    .focus-mode .toolbar {
      display: none;
    }
    .focus-mode .app {
      height: 100vh;
    }
    .focus-mode .grid {
      padding: 6px;
    }
    .focus-exit {
      display: none;
      position: fixed;
      z-index: 5;
      top: 12px;
      right: 12px;
      background: #132a34e8;
    }
    .focus-mode .focus-exit {
      display: block;
    }
    .layout-button.wide {
      min-width: 48px;
    }
    .tile video {
      pointer-events: none;
    }
    @media (max-width: 620px) {
      .grid {
        grid-template-columns: repeat(var(--cols), minmax(100px, 1fr));
        grid-template-rows: repeat(var(--rows), minmax(100px, 1fr));
        grid-auto-rows: auto;
        overflow: auto;
      }
      .tile select {
        max-width: 100%;
      }
    }
  </style>
  <link rel="stylesheet" href="/app.css" />
  <header>
    <h1><span class="logo"><img src="/streamhub-logo.svg" alt=""></span>STREAMHUB</h1>
    <div class="tools">
      <span class="badge">Подключение…</span><span class="muted">Оператор</span>
    </div>
  </header>
  <div class="app">
    <aside>
      <nav id="nav" aria-label="Основная навигация"></nav>
      <section class="sources">
        <h3>Источники <span id="count" class="muted"></span></h3>
        <input
          id="search"
          placeholder="Найти источник"
          aria-label="Поиск источников"
        />
        <div id="sourceList"></div>
        <button id="addSource" style="width: 100%; margin-top: 18px">
          ＋ Добавить источник
        </button>
      </section>
    </aside>
    <main class="workspace">
      <div id="toolbar" class="toolbar"></div>
      <div id="main" style="display: contents"></div>
    </main>
  </div>
  <footer class="footer">
    <span>◌ Видеосервер не подключён</span><span id="foot"></span>
  </footer>
  <dialog id="dialog"></dialog>
  <button id="focusExit" class="focus-exit">Показать интерфейс · H</button>
  <div id="toast" role="status"></div>
  <script src="/hls.min.js"></script>
  <script src="/layouts.js"></script>
  <script src="/app.js"></script>
</html>
