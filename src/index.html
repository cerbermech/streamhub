<!doctype html>
<html lang="ru">
  <meta charset="utf-8" /><meta
    name="viewport"
    content="width=device-width,initial-scale=1"
  /><title>STREAMHUB</title
  >
  <link rel="stylesheet" href="/app.css" />
  <header>
    <h1><span class="logo"><img src="/streamhub-logo.svg" alt=""></span>STREAMHUB</h1>
    <div class="tools">
      <span class="badge">Подключение…</span><span class="muted">Оператор</span>
    </div>
  </header>
  <div class="app">
    <aside>
      <nav id="nav" aria-label="Основная навигация"></nav>
      <section class="sources">
        <h3>Источники <span id="count" class="muted"></span></h3>
        <input
          id="search"
          placeholder="Найти источник"
          aria-label="Поиск источников"
        />
        <div id="sourceList"></div>
        <button id="addSource" style="width: 100%; margin-top: 18px">
          ＋ Добавить источник
        </button>
      </section>
    </aside>
    <main class="workspace">
      <div id="toolbar" class="toolbar"></div>
      <div id="main" style="display: contents"></div>
    </main>
  </div>
  <footer class="footer">
    <span>◌ Видеосервер не подключён</span><span id="foot"></span>
  </footer>
  <dialog id="dialog"></dialog>
  <button id="focusExit" class="focus-exit">Показать интерфейс · H</button>
  <div id="toast" role="status"></div>
  <script src="/hls.min.js"></script>
  <script src="/layouts.js"></script>
  <script src="/monitoring.js"></script>
    <script src="/app.js"></script>
</html>
